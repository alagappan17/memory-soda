<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    Monochrome, matching the docs theme. SVG favicons honour prefers-color-scheme
    in Chrome and Firefox, so it flips with the browser chrome instead of
    disappearing against a dark tab strip.
  -->
  <style>
    :root { --ink: #171717; }
    @media (prefers-color-scheme: dark) { :root { --ink: #fafafa; } }
  </style>
  <rect x="9" y="3" width="14" height="26" rx="4" fill="none" stroke="var(--ink)" stroke-width="2.5"/>
  <circle cx="14" cy="12" r="1.6" fill="var(--ink)"/>
  <circle cx="19" cy="16" r="1.6" fill="var(--ink)"/>
  <circle cx="14" cy="20" r="1.6" fill="var(--ink)"/>
  <circle cx="18.5" cy="23.5" r="1.2" fill="var(--ink)"/>
</svg>
